name: Build OFM Gateway APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools and platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 || true
        working-directory: ${{ github.workspace }}

      - name: Build release APK
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon --stacktrace; else gradle assembleRelease --no-daemon --stacktrace; fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "size=$(stat -c %s "$APK")" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ofm-gateway-release
          path: ${{ steps.apk.outputs.path }}
