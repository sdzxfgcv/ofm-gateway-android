name: Build OFM Gateway APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          gradle --version || true
          ls $ANDROID_HOME/platforms 2>/dev/null || true
          ls $ANDROID_HOME/build-tools 2>/dev/null || true

      - name: Accept SDK licenses
        run: |
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          fi

      - name: Build release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "size=$(stat -c %s "$APK")" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ofm-gateway-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
